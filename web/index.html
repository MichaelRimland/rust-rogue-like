<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hexfall</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111a14;
        color: #ebe6d6;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 1.4rem;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div id="loading">Summoning the forest&hellip;</div>
    <script type="module">
      import init from "./hexfall.js";
      init()
        .catch((error) => {
          // winit uses an exception for control flow on the web; ignore that one.
          if (!error.message.startsWith("Using exceptions for control flow")) {
            throw error;
          }
        })
        .finally(() => document.getElementById("loading")?.remove());
    </script>
  </body>
</html>
